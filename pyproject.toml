[project]
name = "gmf-annotation-platform"
version = "0.1.0"
description = "Simple MVP for importing incidents and running GMF predictions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "openai>=1.99.1,<2.0.0",
  "psycopg2-binary>=2.9.10,<3.0.0",
  "python-dotenv>=1.2.2,<2.0.0",
  "requests>=2.32.0,<3.0.0",
  "sqlalchemy>=2.0.41,<3.0.0",
  "streamlit>=1.48.0,<2.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "google>=3.0.0",
  "huggingface_hub>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
